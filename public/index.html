<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>インカム</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" id="joinScreen">
  <h1>インカム</h1>
  <div class="join-form">
    <input type="text" id="room" placeholder="ルーム名を入力" autocomplete="off">
    <button id="joinBtn">参加</button>
  </div>
  <p id="status" class="status"></p>
</div>

<div class="talk-screen hidden" id="talkScreen">
  <div class="room-label" id="roomLabel"></div>

  <ul id="memberList"></ul>

  <div class="ptt-wrap">
    <div class="ptt-hint">押している間だけ送話</div>
    <button id="pttBtn" class="ptt-btn">
      <span class="ptt-icon">🎙</span>
      <span class="ptt-text">PTT</span>
    </button>
    <div class="ptt-hint sub">画面をどこでも素早く2回タップで切替 / イヤホンボタンでも切替できます</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
